[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "colabllm"
version = "0.1.4"
description = "Run model services on Google Colab with managed tunnels and authentication"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.scripts]
colabllm = "colabllm.cli:main"

[project.urls]
Homepage = "https://github.com/deluxebear/colabllm"
Repository = "https://github.com/deluxebear/colabllm"
Issues = "https://github.com/deluxebear/colabllm/issues"
Changelog = "https://github.com/deluxebear/colabllm/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["colabllm"]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
colabllm = ["lib/*.py", "services/*.py", "services/*.ipynb", "webui/*.html", "webui/*.css", "webui/*.js", "webui/*.svg"]

[tool.setuptools.data-files]
"share/colabllm/skills/colabllm" = ["skills/colabllm/SKILL.md"]
"share/colabllm/skills/colabllm/references" = ["skills/colabllm/references/*.md"]
